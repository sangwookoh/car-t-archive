name: Weekly PubMed update

on:
  schedule:
    - cron: "47 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubmed-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new publications
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python scripts/fetch_pubmed.py weekly --lookback 45

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No new records."
            exit 0
          fi
          git add data/
          git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
          git push
