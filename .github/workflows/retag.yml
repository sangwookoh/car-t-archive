name: Retag records

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubmed-archive
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retag
        run: python scripts/fetch_pubmed.py retag

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No tag changes."
            exit 0
          fi
          git add data/
          git commit -m "data: retag with current classification rules"
          git push
