name: Backfill by year

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "시작 연도"
        required: true
        default: "2024"
      to_year:
        description: "종료 연도"
        required: true
        default: "2024"

permissions:
  contents: write

concurrency:
  group: pubmed-archive
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          python scripts/fetch_pubmed.py backfill \
            --from ${{ inputs.from_year }} \
            --to   ${{ inputs.to_year }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No new records."
            exit 0
          fi
          git add data/
          git commit -m "data: backfill ${{ inputs.from_year }}-${{ inputs.to_year }}"
          git push
